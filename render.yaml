# One-click deploy on Render (https://render.com).
# Accounts, chats and stickers are saved in the Postgres database given by
# DATABASE_URL (a free Neon database works well: https://neon.tech), so they
# survive restarts and redeploys. Without DATABASE_URL the app falls back to a
# local file, which Render's free plan wipes on every restart.
services:
  - type: web
    name: buddha-connect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
